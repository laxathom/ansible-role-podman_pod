---
- name: Reload systemd user daemon
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ podman_pod_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid.stdout }}"

- name: Restart pod service
  ansible.builtin.systemd_service:
    name: "{{ podman_pod_name }}-pod.service"
    state: restarted
    scope: user
  become: true
  become_user: "{{ podman_pod_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_user_uid.stdout }}/bus"

